<section class="cv-page"
         data-page-script="js/cv.js"
         data-page-style="css/cv.css">

    <header class="page-header">
        <div>
            <div class="eyebrow">PROFILE</div>
            <h1>Curriculum Vitae</h1>
            <p>Professional profile, technical skills and experience.</p>
        </div>

        <button class="outline-btn" id="cv-edit-toggle" type="button" hidden>
            Edit sections
        </button>
    </header>

    <!-- Profile summary at the top -->
    <section class="cv-profile">
        <div class="avatar-placeholder">
            <span>FINN</span>
        </div>

        <div class="profile-details">
            <h2 id="cv-name">Loading...</h2>
            <p id="cv-title">Full Stack Developer</p>

            <div class="meta-row">
                <span id="cv-location"></span>
                <span id="cv-email"></span>
                <span id="cv-phone"></span>
            </div>
        </div>
    </section>

    <!-- CV sections are generated by cv.js -->
    <div class="cv-grid" id="cv-sections">
        <div class="cv-loading">Loading CV information...</div>
    </div>

</section>
