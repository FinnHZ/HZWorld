
<div class="calendar-page"
     data-page-script="../js/calendar-note.js"
     data-page-style="../css/calendar-note.css">

    <!-- ==========================================
         PAGE HEADER
    =========================================== -->

    <div class="calendar-header">

        <div class="calendar-heading">

            <h1>Calendar & Notes</h1>

            <p>
                Manage your work, personal and family events.
            </p>

        </div>

        <button type="button"
                id="today-btn"
                class="outline-btn">
            Today
        </button>

    </div>


    <!-- ==========================================
         CALENDAR MAIN LAYOUT
    =========================================== -->

    <div class="calendar-layout">


        <!-- ======================================
             LEFT: CALENDAR
        ======================================= -->

        <section class="panel calendar-panel">

            <!-- Calendar toolbar -->

            <div class="calendar-toolbar">

                <button type="button"
                        id="prev-month"
                        class="outline-btn"
                        aria-label="Previous month">
                    &lt;
                </button>


                <h2 id="month-title">
                    Loading...
                </h2>


                <button type="button"
                        id="next-month"
                        class="outline-btn"
                        aria-label="Next month">
                    &gt;
                </button>

            </div>


            <!-- Weekday headings -->

            <div class="weekday-row">

                <span>Sun</span>
                <span>Mon</span>
                <span>Tue</span>
                <span>Wed</span>
                <span>Thu</span>
                <span>Fri</span>
                <span>Sat</span>

            </div>


            <!-- Calendar date cells are generated by JavaScript -->

            <div id="calendar-grid"
                 class="calendar-grid">
            </div>


            <!-- Calendar legend -->
<!-- 
            <div class="calendar-legend">

                <div class="legend-item">
                    <span class="legend-dot today-dot"></span>
                    Today
                </div>

                <div class="legend-item">
                    <span class="legend-dot selected-dot"></span>
                    Selected date
                </div>

                <div class="legend-item">
                    <span class="legend-dot event-dot"></span>
                    Has events
                </div>

            </div> -->

        </section>


        <!-- ======================================
             RIGHT: SUMMARY AND CHARTS
        ======================================= -->

        <aside class="calendar-summary">


            


            <!-- Pie chart -->

            <section class="panel chart-panel">

                <div class="section-title">
                    Event Distribution
                </div>

                <div id="event-type-chart"
                     class="chart-container">
                </div>

            </section>


            <!-- Bar chart -->

            <section class="panel chart-panel">

                <div class="section-title">
                    Monthly Overview
                </div>

                <div id="event-count-chart"
                     class="chart-container">
                </div>

            </section>

        </aside>

    </div>


    <!-- ==========================================
         SELECTED DATE EVENTS
    =========================================== -->

    <section class="panel selected-events-panel"
             id="selected-events-panel">

        <div class="selected-events-header">

            <div>

                <div class="section-title">
                    Selected Date Events
                </div>

                <h2 id="selected-date-title">
                    Loading...
                </h2>

            </div>


            <span id="selected-event-count">
            </span>

        </div>


        <!-- Event cards are generated by calendar-ui.js -->

        <div id="selected-events-list"
             class="selected-events-list">

            <div class="empty-message">
                Loading events...
            </div>

        </div>

    </section>


    <!-- ==========================================
         ADD / EDIT EVENT MODAL
    =========================================== -->

    <div id="event-modal"
         class="modal"
         hidden
         aria-hidden="true">

        <div class="modal-content">

            <!-- Modal header -->

            <div class="modal-header">

                <h2 id="event-modal-title">
                    Add Event
                </h2>


                <button type="button"
                        class="modal-close"
                        data-close-modal
                        aria-label="Close">
                    &times;
                </button>

            </div>


            <!-- Event form -->

            <form id="event-form">


                <!-- Hidden event ID for editing -->

                <input type="hidden"
                       id="event-id">


                <!-- Event date -->

                <div class="form-group">

                    <label for="event-date">
                        Event Date
                    </label>

                    <input type="date"
                           id="event-date"
                           required>

                </div>


                <!-- Event title -->

                <div class="form-group">

                    <label for="event-title">
                        Title
                    </label>

                    <input type="text"
                           id="event-title"
                           placeholder="Enter event title"
                           maxlength="150"
                           required>

                </div>


                <!-- Event description -->

                <div class="form-group">

                    <label for="event-description">
                        Description
                    </label>

                    <textarea id="event-description"
                              rows="4"
                              placeholder="Enter event description"></textarea>

                </div>


                <!-- Priority -->

                <div class="form-group">

                    <label for="event-priority">
                        Priority
                    </label>

                    <select id="event-priority"
                            required>

                        <option value="high">
                            High
                        </option>

                        <option value="medium" selected>
                            Medium
                        </option>

                        <option value="low">
                            Low
                        </option>

                    </select>

                </div>


                <!-- Event type -->

                <div class="form-group">

                    <label for="event-type">
                        Event Type
                    </label>

                    <select id="event-type"
                            required>

                        <option value="work">
                            Work
                        </option>

                        <option value="personal">
                            Personal
                        </option>

                        <option value="family">
                            Family
                        </option>

                        <option value="other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- Remote sync -->

                <div class="form-group checkbox-group">

                    <label>

                        <input type="checkbox"
                               id="event-remote">

                        Remote Sync

                    </label>

                </div>


                <!-- Completed -->

                <div class="form-group checkbox-group">

                    <label>

                        <input type="checkbox"
                               id="event-completed">

                        Completed

                    </label>

                </div>


                <!-- Form actions -->

                <div class="modal-actions">

                    <button type="button"
                            class="outline-btn"
                            data-close-modal>
                        Cancel
                    </button>


                    <button type="submit"
                            class="primary-btn">
                        Save Event
                    </button>

                </div>


            </form>

        </div>

    </div>

</div>
